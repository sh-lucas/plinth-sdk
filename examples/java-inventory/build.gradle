plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'dev.shlucas.plinth:plinth-sdk'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


application {
    mainClass = 'inventory.InventoryApp'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped'; exceptionFormat 'short' }
}
